<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 เกมทายชื่อถนน</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- เรียกใช้ CSS ของเกม -->
    <link rel="stylesheet" href="style.css?v=1.1">
</head>
<body>

    <div id="map"></div>

    <!-- แถบบน -->
    <div class="instruction-banner">
        🖱️ กด <kbd>Shift</kbd> ค้างไว้ แล้ว <strong>ลากกรอบ</strong> บนแผนที่เพื่อเลือกพื้นที่
    </div>

    <!-- แผงเกม -->
    <div class="game-panel" id="gamePanel">
        <!-- สถิติ -->
        <div class="stats">
            <div class="score-box">⭐ คะแนน <span id="scoreDisplay">0</span></div>
            <div class="category-badge" id="categoryDisplay">🏷️ —</div>
            <div class="timer-box">⏱️ <span class="time" id="timerDisplay">20</span>s</div>
            <div class="progress-text" id="progressDisplay">0 / 0</div>
        </div>

        <div class="word-display" id="wordDisplay">🗺️ ลากกรอบบนแผนที่</div>
        <div class="hint-message" id="hintMessage">
            💡 ทายตัวอักษรทีละตัว (ผิด <span class="wrong-count" id="wrongCount">0</span>/6)
        </div>

        <!-- คีย์บอร์ด A-Z -->
        <div class="keyboard" id="keyboardContainer"></div>

        <!-- ปุ่ม -->
        <div class="actions">
            <button class="btn-hint" id="hintBtn" style="background: rgba(255, 215, 0, 0.2); border-color: rgba(255, 215, 0, 0.3); color: #ffd700;">💡 ตัวช่วย (-10)</button>
            <button class="btn-primary" id="nextRoundBtn">🎲 ข้าม (-5)</button>
            <button class="btn-danger" id="resetGameBtn">🔄 เลือกใหม่</button>
        </div>
    </div>

    <!-- Game Summary Modal -->
    <div class="modal-overlay" id="summaryModal">
        <div class="modal-content">
            <h2 class="modal-title">🏁 สรุปผลภารกิจ</h2>
            <div class="modal-stats">
                <div class="stat-item">
                    <span class="stat-label">คะแนนรวม</span>
                    <span class="stat-value" id="finalScore">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">ทายถูก</span>
                    <span class="stat-value" id="finalCorrect">0/10</span>
                </div>
            </div>
            <div class="grade-badge" id="finalGrade">A</div>
            <p class="grade-message" id="gradeMessage">ยอดเยี่ยม! คุณคือผู้เชี่ยวชาญแผนที่</p>
            <button class="btn-primary w-full" id="playAgainBtn" style="width: 100%; margin-top: 20px;">🔄 เริ่มภารกิจใหม่</button>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    
    <!-- เรียกใช้ JS ของเกม -->
    <script src="script.js?v=1.1"></script>
</body>
</html>
