<!DOCTYPE html>
<html lang="th" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการค่าใช้จ่ายรถยนต์ | Admin</title>
    <meta name="robots" content="noindex, nofollow">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Prompt & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind Custom Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Prompt', 'sans-serif'],
                        prompt: ['Prompt', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            200: '#ddd6fe',
                            300: '#c4b5fd',
                            400: '#a78bfa',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                            800: '#5b21b6',
                            900: '#4c1d95',
                        },
                    }
                }
            }
        }
    </script>
    
    <!-- Theme Switcher Init script -->
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <link rel="stylesheet" href="assets/css/style.css">
    
    <style>
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #8b5cf6;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-[#fafafa] dark:bg-slate-950 text-slate-800 dark:text-slate-200 font-sans antialiased transition-colors duration-300 min-h-screen flex flex-col">

    <!-- Header & Navigation -->
    <header class="sticky top-0 z-50 backdrop-blur-md bg-white/70 dark:bg-slate-950/70 border-b border-slate-200/50 dark:border-slate-800/50 transition-colors duration-300">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="text-xl font-bold tracking-tight bg-gradient-to-r from-brand-600 to-indigo-600 dark:from-brand-400 dark:to-indigo-400 bg-clip-text text-transparent hover:scale-105 transition-transform">
                <a href="index.html" class="flex items-center gap-2">
                    <span class="text-2xl leading-none">🏠</span>
                    <span>หน้าแรก</span>
                </a>
            </div>
            
            <div class="flex items-center space-x-4">
                <!-- Theme Toggle Button -->
                <button id="theme-toggle" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-900 border border-slate-200/50 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors" aria-label="Toggle Theme">
                    <svg id="theme-toggle-sun" class="w-4 h-4 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m12.728 12.728l.707.707M12 8a4 4 0 100 8 4 4 0 000-8z"></path></svg>
                    <svg id="theme-toggle-moon" class="w-4 h-4 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                </button>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center p-6">
        
        <!-- Login Section -->
        <div id="loginSection" class="w-full max-w-md bg-white dark:bg-slate-900 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-800 p-8 transform transition-all">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-brand-100 dark:bg-brand-900/30 text-brand-600 dark:text-brand-400 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <h2 class="text-2xl font-bold text-slate-800 dark:text-white">เข้าสู่ระบบจัดการ</h2>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-2">กรุณาใส่รหัสผ่านเพื่อบันทึกค่าใช้จ่ายรถยนต์</p>
            </div>
            <form id="loginForm" class="space-y-4">
                <div>
                    <input type="password" id="pinInput" placeholder="รหัส PIN" class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all text-center text-lg tracking-widest" required autocomplete="off">
                </div>
                <p id="loginError" class="text-red-500 text-sm text-center hidden">รหัสผ่านไม่ถูกต้อง</p>
                <button type="submit" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-semibold shadow-lg shadow-brand-500/30 transition-all transform hover:scale-[1.02] active:scale-95">
                    เข้าสู่ระบบ
                </button>
            </form>
        </div>

        <!-- Expense Form Section (Hidden by default) -->
        <div id="expenseSection" class="w-full max-w-2xl bg-white dark:bg-slate-900 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-800 p-8 hidden transform transition-all">
            <div class="flex items-center justify-between mb-8">
                <h2 class="text-2xl font-bold text-slate-800 dark:text-white flex items-center gap-2">
                    <svg class="w-6 h-6 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    บันทึกค่าใช้จ่ายรถยนต์
                </h2>
                <button id="logoutBtn" class="text-sm text-slate-500 hover:text-red-500 transition-colors">ออกจากระบบ</button>
            </div>

            <!-- IMPORTANT: The Web App URL will be placed here by the user later -->
            <form id="expenseForm" class="space-y-6">
                <!-- Data layout -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    
                    <!-- Date -->
                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">วันและเวลา</label>
                        <input type="datetime-local" id="dateInput" required class="w-full px-4 py-2.5 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500">
                    </div>

                    <!-- Category -->
                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">หมวดหมู่</label>
                        <select id="categoryInput" required class="w-full px-4 py-2.5 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500">
                            <option value="" disabled selected>เลือกหมวดหมู่...</option>
                            <option value="น้ำมัน">ค่าน้ำมัน</option>
                            <option value="แก๊ส LPG">ค่าแก๊ส LPG</option>
                            <option value="ซ่อมบำรุง">ค่าซ่อมบำรุงทั่วไป</option>
                            <option value="เข้าศูนย์">ค่าบริการเข้าศูนย์</option>
                            <option value="ประกันภัย">ประกันภัย</option>
                            <option value="พ.ร.บ.">พ.ร.บ.</option>
                            <option value="ภาษี">ภาษีรถยนต์</option>
                            <option value="ล้างรถ">ล้างรถ</option>
                        </select>
                    </div>

                    <!-- Amount -->
                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">จำนวนเงิน (บาท)</label>
                        <input type="number" id="amountInput" step="0.01" min="0" required placeholder="0.00" class="w-full px-4 py-2.5 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500">
                    </div>

                    <!-- Odometer -->
                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">เลขไมล์ (km)</label>
                        <input type="number" id="odometerInput" min="0" placeholder="เลขไมล์ปัจจุบัน (ถ้ามี)" class="w-full px-4 py-2.5 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500">
                    </div>
                </div>

                <!-- Fuel specific fields (Hidden by default) -->
                <div id="fuelFields" class="grid grid-cols-1 md:grid-cols-2 gap-6 hidden">
                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">จำนวนลิตร (L)</label>
                        <input type="number" id="litersInput" step="0.01" min="0" placeholder="0.00" class="w-full px-4 py-2.5 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">ราคาต่อลิตร (บาท/L)</label>
                        <input type="number" id="pricePerLiterInput" step="0.01" min="0" placeholder="0.00" class="w-full px-4 py-2.5 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500">
                    </div>
                </div>

                <!-- Note -->
                <div class="space-y-2">
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">หมายเหตุ / รายละเอียด</label>
                    <textarea id="noteInput" rows="2" placeholder="รายละเอียดเพิ่มเติม..." class="w-full px-4 py-2.5 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500"></textarea>
                </div>

                <!-- File Upload -->
                <div class="space-y-2">
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">แนบรูปภาพใบเสร็จ</label>
                    <div class="flex items-center justify-center w-full">
                        <label for="fileInput" class="flex flex-col items-center justify-center w-full h-32 border-2 border-slate-300 border-dashed rounded-lg cursor-pointer bg-slate-50 dark:hover:bg-slate-800 dark:bg-slate-800/50 hover:bg-slate-100 dark:border-slate-600 dark:hover:border-slate-500 transition-colors">
                            <div class="flex flex-col items-center justify-center pt-5 pb-6">
                                <svg class="w-8 h-8 mb-3 text-slate-500 dark:text-slate-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 16">
                                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"/>
                                </svg>
                                <p class="mb-2 text-sm text-slate-500 dark:text-slate-400"><span class="font-semibold">คลิกเพื่อเลือกไฟล์</span> หรือลากไฟล์มาวาง</p>
                                <p class="text-xs text-slate-500 dark:text-slate-400">PNG, JPG, หรือ JPEG (แนะนำขนาดไม่เกิน 5MB)</p>
                            </div>
                            <input id="fileInput" type="file" class="hidden" accept="image/png, image/jpeg, image/jpg" />
                        </label>
                    </div>
                    <p id="fileNameDisplay" class="text-sm text-brand-600 dark:text-brand-400 mt-2 hidden text-center font-medium"></p>
                </div>

                <!-- Web App URL config (Hidden input, needs to be set by user) -->
                <!-- The user will replace YOUR_WEB_APP_URL with the actual URL -->
                <input type="hidden" id="scriptUrl" value="https://script.google.com/macros/s/AKfycbyoh_20VrGqAFM-SCuQStzVOfwUDn4bbSXAAKyAZvrJivri5nZhoqry82oI3fyg7PQ7/exec">
                
                <!-- Status Message -->
                <div id="statusMessage" class="hidden p-4 rounded-lg text-sm font-medium text-center"></div>

                <!-- Submit -->
                <button type="submit" id="submitBtn" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-semibold shadow-lg shadow-brand-500/30 transition-all flex justify-center items-center">
                    <span id="btnText">บันทึกข้อมูล</span>
                </button>
            </form>
        </div>
    </main>

    <!-- Script for Logic -->
    <script>
        const PIN = '081579';
        
        // Elements
        const loginSection = document.getElementById('loginSection');
        const expenseSection = document.getElementById('expenseSection');
        const loginForm = document.getElementById('loginForm');
        const pinInput = document.getElementById('pinInput');
        const loginError = document.getElementById('loginError');
        const logoutBtn = document.getElementById('logoutBtn');
        const dateInput = document.getElementById('dateInput');
        const categoryInput = document.getElementById('categoryInput');
        
        const expenseForm = document.getElementById('expenseForm');
        const fuelFields = document.getElementById('fuelFields');
        const litersInput = document.getElementById('litersInput');
        const pricePerLiterInput = document.getElementById('pricePerLiterInput');
        const fileInput = document.getElementById('fileInput');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const statusMessage = document.getElementById('statusMessage');
        const scriptUrlInput = document.getElementById('scriptUrl');
        
        // Theme Toggle Logic
        const themeToggleBtn = document.getElementById('theme-toggle');
        const darkIcon = document.getElementById('theme-toggle-moon');
        const lightIcon = document.getElementById('theme-toggle-sun');

        if (document.documentElement.classList.contains('dark')) {
            darkIcon.classList.add('hidden');
            lightIcon.classList.remove('hidden');
        }

        themeToggleBtn.addEventListener('click', function() {
            darkIcon.classList.toggle('hidden');
            lightIcon.classList.toggle('hidden');

            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        });

        // Helper to get local datetime string for input
        function getLocalIsoString() {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            return now.toISOString().slice(0, 16);
        }

        // Set Today's Date default
        let today = getLocalIsoString();
        dateInput.value = today;

        // Login Logic
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (pinInput.value === PIN) {
                loginSection.classList.add('hidden');
                expenseSection.classList.remove('hidden');
                loginError.classList.add('hidden');
                sessionStorage.setItem('isLoggedIn', 'true');
            } else {
                loginError.classList.remove('hidden');
            }
        });

        // Auto Login if session exists
        if (sessionStorage.getItem('isLoggedIn') === 'true') {
            loginSection.classList.add('hidden');
            expenseSection.classList.remove('hidden');
        }

        // Logout
        logoutBtn.addEventListener('click', () => {
            sessionStorage.removeItem('isLoggedIn');
            expenseSection.classList.add('hidden');
            loginSection.classList.remove('hidden');
            pinInput.value = '';
        });

        // File Selection display
        let selectedFileBase64 = null;
        let selectedFileName = '';
        let selectedFileMime = '';

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                fileNameDisplay.textContent = `ไฟล์ที่เลือก: ${file.name}`;
                fileNameDisplay.classList.remove('hidden');
                selectedFileName = file.name;
                selectedFileMime = file.type;

                const reader = new FileReader();
                reader.onload = function(event) {
                    // Extract base64 part
                    selectedFileBase64 = event.target.result.split(',')[1];
                };
                reader.readAsDataURL(file);
            } else {
                fileNameDisplay.classList.add('hidden');
                selectedFileBase64 = null;
                selectedFileName = '';
                selectedFileMime = '';
            }
        });

        // Show/hide fuel fields based on category
        categoryInput.addEventListener('change', (e) => {
            const val = e.target.value;
            if (val === 'น้ำมัน' || val === 'แก๊ส LPG') {
                fuelFields.classList.remove('hidden');
            } else {
                fuelFields.classList.add('hidden');
                litersInput.value = '';
                pricePerLiterInput.value = '';
            }
        });

        // Form Submit
        expenseForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const scriptUrl = scriptUrlInput.value;
            if (scriptUrl === 'YOUR_WEB_APP_URL' || !scriptUrl) {
                showStatus('กรุณาตั้งค่า Google Apps Script Web App URL ในโค้ดก่อนใช้งาน', 'error');
                return;
            }

            // Set loading state
            submitBtn.disabled = true;
            btnText.innerHTML = '<span class="loader"></span> กำลังบันทึก...';
            statusMessage.classList.add('hidden');

            const payload = {
                pin: PIN,
                date: document.getElementById('dateInput').value,
                category: document.getElementById('categoryInput').value,
                amount: document.getElementById('amountInput').value,
                odometer: document.getElementById('odometerInput').value || '',
                liters: document.getElementById('litersInput').value || '',
                pricePerLiter: document.getElementById('pricePerLiterInput').value || '',
                note: document.getElementById('noteInput').value || '',
                filename: selectedFileName,
                mimeType: selectedFileMime,
                fileData: selectedFileBase64
            };

            try {
                // Since this uses no-cors, it's a bit blind. fetch will return opaque response.
                const response = await fetch(scriptUrl, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                    // mode: 'no-cors' requires we only send simple headers (text/plain).
                    // Google Apps Script usually expects text/plain anyway for JSON POSTs with no-cors.
                });
                
                showStatus('บันทึกข้อมูลเรียบร้อยแล้ว!', 'success');
                
                // Reset form
                expenseForm.reset();
                today = getLocalIsoString(); // Update to current time
                dateInput.value = today;
                fuelFields.classList.add('hidden'); // Reset hidden state
                fileNameDisplay.classList.add('hidden');
                selectedFileBase64 = null;
                selectedFileName = '';
                selectedFileMime = '';

            } catch (error) {
                console.error(error);
                showStatus('เกิดข้อผิดพลาดในการเชื่อมต่อ', 'error');
            } finally {
                // Reset button state
                submitBtn.disabled = false;
                btnText.textContent = 'บันทึกข้อมูล';
            }
        });

        function showStatus(message, type) {
            statusMessage.textContent = message;
            statusMessage.classList.remove('hidden', 'bg-green-100', 'text-green-700', 'bg-red-100', 'text-red-700');
            
            if (type === 'success') {
                statusMessage.classList.add('bg-green-100', 'text-green-700');
            } else {
                statusMessage.classList.add('bg-red-100', 'text-red-700');
            }
        }
    </script>
</body>
</html>
